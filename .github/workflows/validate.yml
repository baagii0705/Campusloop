name: Validate website

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run static lint validation
        run: npm run lint

      - name: Run type-check validation
        run: npm run typecheck

      - name: Build production assets
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html && test -f dist/appwrite-client.js
