name: Sol1o iOS archive
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ios-archive.yml'

permissions:
  contents: read

jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Select Xcode with the iOS 26 SDK
        shell: bash
        run: |
          set -euo pipefail
          developer_dir=$(python3 - <<'PY'
          from pathlib import Path
          import re
          versions = []
          for app in Path('/Applications').glob('Xcode_26*.app'):
              match = re.fullmatch(r'Xcode_(26(?:\.\d+)*)\.app', app.name)
              if match:
                  versions.append((tuple(map(int, match[1].split('.'))), app))
          if not versions:
              raise SystemExit('Xcode 26 is unavailable on this runner.')
          print(max(versions)[1] / 'Contents/Developer')
          PY
          )
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run cap:add:ios
      - name: Archive for iPhone and iPad without distribution credentials
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Sol1o.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive
          test -f "$RUNNER_TEMP/Sol1o.xcarchive/Products/Applications/App.app/public/index.html"
          ditto -c -k --keepParent "$RUNNER_TEMP/Sol1o.xcarchive" "$RUNNER_TEMP/Sol1o-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Sol1o-unsigned-iOS-archive
          path: ${{ runner.temp }}/Sol1o-unsigned.zip
          retention-days: 7
