name: Solio Android Debug APK
on:
  workflow_dispatch:
jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest already includes Android SDK; avoid setup-android tool download failures.
      - name: Check Android SDK
        run: test -d "$ANDROID_HOME" && "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - run: npm install
      - run: npm run cap:add:android
      - name: Build unsigned debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: solio-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
